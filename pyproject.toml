[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "big-advogados"
version = "1.4.3"
description = "Stack jurídica para advogados brasileiros — certificados digitais, assinatura, WebSigner, transcritor de áudio."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Leonardo Athayde", email = "leoathayde@gmail.com" },
]
keywords = ["icp-brasil", "certificado-digital", "advogado", "pkcs11", "whisper", "transcricao"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]

# Mínimo absoluto para a CLI (transcritor). Quem instalar via pip/uv
# pega só o necessário para usar o transcritor; a GUI completa
# requer GTK4/Adwaita que vêm pelo PKGBUILD.
dependencies = [
    "faster-whisper>=1.0",
    "reportlab>=4.0",
    "typer>=0.12",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
# Deps usadas apenas pelo lado GUI/PKCS11 do app — opcional para quem
# só quer o transcritor via pip.
gui = [
    "PyGObject>=3.46",
    "pykcs11>=1.5.11",
    "pyudev>=0.24.1",
    "cryptography>=41.0",
    "endesive>=2.17",
    "pikepdf>=8.0",
    "pillow>=10.0",
    "asn1crypto",
    "oscrypto",
    "qrcode",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/xathay/big-advogados"
Repository = "https://github.com/xathay/big-advogados"
Issues = "https://github.com/xathay/big-advogados/issues"

[project.scripts]
big-advogados = "src.transcritor.cli:main"

[tool.setuptools]
packages = [
    "src",
    "src.transcritor",
    "src.certificate",
    "src.browser",
    "src.ui",
    "src.utils",
    "src.websigner",
    "src.drivers",
    "src.data",
]

[tool.setuptools.package-data]
"src.data" = ["*.toml", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "integration: testes que exercitam faster-whisper de verdade (lentos, exigem modelo baixado)",
    "gpu: testes que exigem GPU CUDA",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # line-length — já controlado por line-length acima
]
