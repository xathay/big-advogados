[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "big-advogados"
dynamic = ["version"]
description = "Stack jurídica para advogados brasileiros — certificados digitais, assinatura, WebSigner, transcritor de áudio."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Projeto Big Advogados" },
]
keywords = ["icp-brasil", "certificado-digital", "advogado", "pkcs11", "whisper", "transcricao"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]

# Mínimo absoluto para a CLI (transcritor). Quem instalar via pip/uv
# pega só o necessário para usar o transcritor; a GUI completa
# requer GTK4/Adwaita que vêm pelo PKGBUILD.
dependencies = [
    "faster-whisper>=1.0",
    "reportlab>=4.0",
    "typer>=0.12",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
# Deps usadas apenas pelo lado GUI/PKCS11 do app — opcional para quem
# só quer o transcritor via pip.
gui = [
    "PyGObject>=3.46",
    "pykcs11>=1.5.11",
    "pyudev>=0.24.1",
    "cryptography>=41.0",
    "endesive>=2.17",
    "pikepdf>=8.0",
    "pillow>=10.0",
    "asn1crypto",
    "oscrypto",
    "qrcode",
]
# Frontend TUI (Textual) — companheiro de terminal para Omarchy/Hyprland.
# Reusa a lógica de src/; precisa do transcritor (deps core) + textual.
tui = [
    "textual>=0.60",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "textual-dev>=1.5",
]

[project.urls]
Homepage = "https://github.com/xathay/big-advogados"
Repository = "https://github.com/xathay/big-advogados"
Issues = "https://github.com/xathay/big-advogados/issues"

[project.scripts]
big-advogados = "src.transcritor.cli:main"
big-advogados-tui = "tui.__main__:main"

[tool.setuptools]
packages = [
    "src",
    "src.transcritor",
    "src.certificate",
    "src.browser",
    "src.ui",
    "src.utils",
    "src.websigner",
    "src.drivers",
    "src.data",
    "tui",
    "tui.screens",
    "tui.services",
]

[tool.setuptools.dynamic]
version = { attr = "src.version.VERSION" }

[tool.setuptools.package-data]
"src.data" = ["*.toml", "*.json"]
"tui" = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "integration: testes que exercitam faster-whisper de verdade (lentos, exigem modelo baixado)",
    "gpu: testes que exigem GPU CUDA",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # line-length — já controlado por line-length acima
]
