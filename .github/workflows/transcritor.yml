name: transcritor

on:
  push:
    branches: [main]
    paths:
      - "src/transcritor/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/transcritor.yml"
  pull_request:
    paths:
      - "src/transcritor/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/transcritor.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps (poppler para pdftotext, ffmpeg para metadados)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # Instala apenas as deps necessárias pros testes do transcritor.
          # NÃO instala faster-whisper (3GB de modelo + tensores) nem PyGObject (GUI).
          pip install reportlab>=4.0 typer>=0.12 pytest>=7.0
          if [ "${{ matrix.python-version }}" = "3.10" ]; then
            pip install tomli>=2.0
          fi

      - name: Run transcritor tests
        run: |
          pytest tests/ -v --tb=short -m "not integration and not gpu"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src/transcritor/ tests/

      - name: Ruff format check
        run: ruff format --check src/transcritor/ tests/
