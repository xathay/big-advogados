name: testes

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tui/**"
      - "data/drivers/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/transcritor.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tui/**"
      - "data/drivers/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/transcritor.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps (poppler para pdftotext, ffmpeg para metadados)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils ffmpeg

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Não instala faster-whisper (modelos grandes) nem PyGObject (GUI).
          # Inclui a pilha criptográfica exercitada pelos testes de assinatura.
          python -m pip install \
            "reportlab>=4.0" \
            "typer>=0.12" \
            "pytest>=7.0" \
            "cryptography>=41.0" \
            "endesive>=2.17" \
            "qrcode>=7.0"
          if [ "${{ matrix.python-version }}" = "3.10" ]; then
            python -m pip install "tomli>=2.0"
          fi

      - name: Run test suite
        run: |
          pytest tests/ -v --tb=short -m "not integration and not gpu"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Critical static checks
        # O legado de estilo será tratado separadamente; a CI bloqueia desde
        # já erros de sintaxe, nomes indefinidos e falhas equivalentes.
        run: ruff check src/ tests/ scripts/ tui/ --select E9,F63,F7,F82
